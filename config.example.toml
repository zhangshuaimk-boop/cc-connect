[[projects]]
name = "example"
# mode = "single" # single or multi-workspace
# reset_on_idle_mins = 30
# admin_from = "*"
# filter_external_sessions = false

[projects.agent]
type = "codex"
# provider_refs = ["openai"]

[projects.agent.options]
work_dir = "/path/to/your/project"
# model = "gpt-5.1-codex"
# mode = "default"

# [projects.display]
# mode = "compact"

# [projects.users]
# default_role = "member"
# [projects.users.roles.admin]
# user_ids = ["ou_xxx"]
# disabled_commands = []

[[projects.platforms]]
type = "feishu" # or "lark"

[projects.platforms.options]
app_id = "${FEISHU_APP_ID}"
app_secret = "${FEISHU_APP_SECRET}"
allow_from = "*" # comma-separated Feishu open_id/user_id list, or "*"
# encrypt_key = "${FEISHU_ENCRYPT_KEY}"
# verification_token = "${FEISHU_VERIFICATION_TOKEN}"
# domain = "https://open.feishu.cn"
# disable_interactive_cards = false
# clean_reply = false
# update_card_interval_ms = 1500
# rich_card = true
# card_width = "fill"

