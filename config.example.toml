# cc-connect configuration
#
# String values support ${VAR_NAME} environment variable substitution.
# Example: app_id = "${FEISHU_APP_ID}"

# language = "en" # en, zh, zh-TW, ja, es; empty means auto-detect
# data_dir = "~/.cc-connect"
# shell = "/bin/zsh"
# shell_profile = "source ~/.zshrc"
# attachment_send = "on"
# max_attachment_size_mb = 50

[log]
level = "info" # debug, info, warn, error

# Global provider definitions can be referenced by projects through
# [projects.agent].provider_refs.
#
# [[providers]]
